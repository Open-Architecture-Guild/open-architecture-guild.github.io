title: Open Architecture Guild
tagline: Offene Referenzmodelle für die Unternehmensarchitektur
description: >-
  Die Open Architecture Guild ist eine offene Gemeinschaft von Architekturpraktikern.
  Wir bauen frei nutzbare, herstellerneutrale Referenzmodelle, zuerst eine Capability Map.
lang: de
url: "https://open-architecture-guild.github.io"
baseurl: ""
repository: Open-Architecture-Guild/open-architecture-guild.github.io

# Theme aus eigenem Repo; fester Tag; Update = neuen Tag setzen und hier eintragen
remote_theme: Open-Architecture-Guild/guild-theme@v0.2.0

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
