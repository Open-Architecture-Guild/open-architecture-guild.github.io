# Entscheidungsregister. Neue Einträge ergänzen, Status ändern, nichts löschen.
# status: open | decided
open:
  - ref: "ADR-0001"
    title: "Lizenz der Inhalte"
    question: "MIT für alles, oder MIT für den Code und CC BY 4.0 beziehungsweise CC0 für den Katalog?"
    note: "Bis zur Entscheidung steht alles unter MIT."
  - ref: "ADR-0002"
    title: "Quellsprache des Katalogs"
    question: "Englisch als Quellsprache mit deutschen Übersetzungen, oder Deutsch zuerst?"
    note: "Der Prototyp nutzt Englisch mit deutschen Bezeichnungen."
  - title: "Granularität des Kerns"
    question: "Ebene 1 und 2 mit grob 100 bis 150 Einträgen, oder strenger? Das Katalog-Repo empfiehlt drei Ebenen."
  - title: "Startteam der Curators"
    question: "Wer bildet das Team aus zwei bis vier Personen, das Änderungen am Katalog prüft?"
  - title: "Projektname"
    question: "„OpenCap“ ist ein Arbeitstitel. Reicht der Organisationsname, um Verwechslungen mit bestehenden Organisationen auszuschließen?"
  - title: "Reihenfolge der Branchenerweiterungen"
    question: "Mit welchen Branchen beginnen die ersten Erweiterungspakete?"
  - title: "Ort der Dokumentation"
    question: "Konzepte, Prinzipien und Entscheidungen im Katalog-Repo oder auf dieser Webseite?"
decided:
  - title: "Namen nach Business-Objekt und Tätigkeit"
    text: "Nicht mit einem Verb am Anfang."
  - title: "Eine Datei je Capability"
    text: "Die Hierarchie ergibt sich aus der Ordnerstruktur."
  - title: "Drei Gruppen auf Ebene 1"
    text: "core, management und enabling."
  - title: "Kennzahlen gehören nicht in die Capability"
    text: "Sie bekommen später ein eigenes Repository und verweisen auf Capability-IDs."
  - title: "Katalog und Webseite getrennt"
    text: "Der Katalog liegt im Repo Capabilities, die Webseite im Pages-Repo der Organisation."
